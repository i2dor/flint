<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Flint — nodeless Lightning for BTCPay Server">
  <title>Flint — nodeless Lightning for BTCPay Server</title>
  <!--
    The Flint mark: a bold F whose arms end in blade-angled cuts, striking a four-point spark off the
    top arm. This file is the vector source; `logo.png` beside it is the same artwork at 512x512,
    rendered by scripts/render-logo.sh, and the PNG is the file the README shows and the plugin
    registry gets. The registry's upload accepts SVG, but it serves uploaded files from a public blob
    container with a client-supplied content type, so an SVG there is a stored-XSS vector on that
    origin. Upload the PNG.

    Note for editors: this is an XML comment, so it must not contain a double hyphen anywhere. Use an
    em dash. render-logo.sh reads the geometry out of this file, and a browser opening the .svg
    directly parses it as XML, so a malformed comment breaks both.

    Shape notes, from the rounds of drafts this outlived: the letterform carries the identity because
    a letter is the one thing that stays legible at every size a plugin icon renders at, from a 16 px
    favicon to the registry card. The arm cuts angle like a struck edge, and the spark is a solid
    four-point star rather than thin rays because rays vanish below 24 px. Object-based marks (shards,
    strikers, flint-and-steel pairs) were all drawn and all failed the 16 px test in one way or
    another; the sheets are in the design history, not in this repository.

    Colour: slate tile, off-white letter, amber spark. Two colours because the spark is the point of
    the name and should be where the eye lands. The tile is lighter than GitHub's dark background
    (#0d1117) so the silhouette reads there, and dark enough to hold on white.

    The nav icon in Views/Shared/Spark/SparkNav.cshtml is the same geometry fitted to core's 24-unit
    icon box, but monochrome: it paints in currentColor because it renders inside BTCPay's chrome and
    recolours on hover, when active, and under an operator's theme. It cannot carry the amber, and
    SparkBrandingTests enforces that. This file is the opposite case, a standalone raster that
    inherits nothing and so has to carry its own colour.

    Structure contract with render-logo.sh: one <rect> tile, then one <g translate scale> holding
    exactly two filled paths in this order: the letter (with fill-rule), then the spark. The script
    validates each extraction and checks the spark actually appears in the render.
  -->

  <rect width="256" height="256" rx="56" fill="#232B36"/>

  <g transform="translate(-13.29 21.23) scale(9.2045)">
    <path fill="#EFF2F6" fill-rule="nonzero"
          d="M 7,4 L 10.5,4 L 10.5,20.5 L 7,20.5 Z M 10.5,4 L 19.4,4 L 16.8,7.4 L 10.5,7.4 Z M 10.5,10.8 L 16.6,10.8 L 14.6,14.2 L 10.5,14.2 Z"/>
    <path fill="#FFB020"
          d="M 21.4,2.7 L 22.0,4.4 L 23.7,5.0 L 22.0,5.6 L 21.4,7.3 L 20.8,5.6 L 19.1,5.0 L 20.8,4.4 Z"/>
  </g>
</svg>
